<script>
    // 提取码弹窗
    function showCodeModal() {
        document.getElementById('codeModal').classList.remove('hidden');
        document.getElementById('codeError').classList.add('hidden');
        document.getElementById('extractCode').value = '';
    }
    function closeCodeModal() {
        document.getElementById('codeModal').classList.add('hidden');
    }

    // 验证提取码 chindows
    function checkCode() {
        const code = document.getElementById('extractCode').value.trim().toLowerCase();
        if (code === 'chindows') {
            closeCodeModal();
            window.open('https://wwaye.lanzoue.com/iRpdX3i1a8ne', '_blank');
        } else {
            document.getElementById('codeError').classList.remove('hidden');
        }
    }

    // 移动端菜单
    document.getElementById('menuBtn').onclick = function(){
        document.getElementById('mobileMenu').classList.toggle('hidden');
    }

    // 平滑滚动
    document.querySelectorAll('a[href^="#"]').forEach(a=>{
        a.addEventListener('click',e=>{
            e.preventDefault();
            document.querySelector(a.getAttribute('href')).scrollIntoView({behavior:'smooth'});
        });
    });

    // 返回顶部
    window.addEventListener('scroll',()=>{
        const btn = document.getElementById('backToTop');
        if(window.scrollY>500){
            btn.classList.remove('opacity0','invisible');
            btn.classList.add('opacity100','visible');
        }else{
            btn.classList.add('opacity0','invisible');
        }
    });
    document.getElementById('backToTop').onclick = ()=>{
        window.scrollTo({top:0,behavior:'smooth'});
    };
</script>
